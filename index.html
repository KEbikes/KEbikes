<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIKEHUB KE | Profesionálny servis bicyklov v Košiciach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal { animation: fadeInUp 0.8s ease-out forwards; }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .hero-gradient { background: linear-gradient(to bottom, #0a0a0a 0%, #1a1a1a 100%); }
    </style>
</head>
<body class="text-gray-900">

    <header class="glass-header shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 md:px-6 py-4 flex justify-between items-center gap-2">
            <h1 class="text-xl md:text-2xl font-black text-black tracking-tighter uppercase shrink-0">
                BIKEHUB <span class="text-gray-300 italic font-bold">KE</span>
            </h1>
            <nav class="flex items-center gap-2 md:gap-4">
                <a href="#ponuka" class="hidden lg:block font-bold text-[10px] uppercase tracking-[0.2em] text-gray-400 hover:text-black transition px-2">Ponuka</a>
                <a href="#recenzie" class="hidden lg:block font-bold text-[10px] uppercase tracking-[0.2em] text-gray-400 hover:text-black transition px-2">Recenzie</a>
                <a href="servis.html" class="bg-black text-white px-4 md:px-6 py-2 rounded-xl font-black uppercase text-[9px] tracking-[0.1em] hover:bg-gray-800 transition">Servis</a>
                <a href="kontakt.html" class="bg-black text-white px-4 md:px-6 py-2 rounded-xl font-black uppercase text-[9px] tracking-[0.1em] hover:bg-gray-800 transition">Kontakt</a>
            </nav>
        </div>
    </header>

    <section class="relative hero-gradient py-32 px-6 overflow-hidden text-center">
        <div class="max-w-6xl mx-auto relative z-10 reveal">
            <span class="inline-block border border-white/20 text-white/60 text-[9px] font-black px-5 py-1.5 rounded-full uppercase tracking-[0.3em] mb-8">Košice • Professional Studio</span>
            <h2 class="text-6xl md:text-8xl font-black mb-8 uppercase tracking-tighter text-white leading-[0.9]">
                Vyladené bicykle<br><span class="text-gray-600 italic">bez kompromisov.</span>
            </h2>
            <div class="flex flex-wrap justify-center gap-6">
                <a href="#ponuka" class="bg-white text-black px-12 py-5 rounded-2xl font-black uppercase tracking-tight hover:bg-gray-200 transition shadow-2xl">Pozrieť ponuku</a>
                <a href="kontakt.html" class="bg-white/5 text-white border border-white/10 px-12 py-5 rounded-2xl font-black uppercase tracking-tight hover:bg-white/10 transition">Napísať nám</a>
            </div>
        </div>
    </section>

    <!-- Секция велосипедов -->
    <section id="ponuka" class="bg-gray-50 py-32 px-6 rounded-[4rem]">
        <div class="max-w-6xl mx-auto">
            <h3 class="text-5xl font-black uppercase tracking-tighter mb-20">Aktuálna ponuka</h3>
            <div id="bike-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12"></div>
        </div>
    </section>

    <!-- Секция отзывов (свежие пишутся сюда) -->
    <section id="recenzie" class="max-w-6xl mx-auto py-32 px-6">
        <h3 class="text-5xl font-black uppercase tracking-tighter mb-16 italic">Recenzie</h3>
        <div class="bg-white p-10 rounded-[3rem] border border-gray-100 shadow-sm mb-16">
            <h4 class="text-2xl font-black uppercase tracking-tight mb-6">Pridať skúsenosť</h4>
            <div class="grid grid-cols-1 gap-5">
                <input type="text" id="rev-name" placeholder="Vaše meno" class="p-5 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-black">
                <textarea id="rev-text" placeholder="Vaša recenzia..." class="p-5 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-black h-32"></textarea>
                <button onclick="sendReview()" class="bg-black text-white py-5 rounded-2xl font-black uppercase text-[10px] tracking-[0.3em] hover:bg-gray-800 transition shadow-lg">Odoslať</button>
            </div>
        </div>
        <div id="reviews-list" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </section>

    <footer class="py-12 text-center border-t border-gray-100">
        <p class="text-[9px] font-black uppercase tracking-[0.4em] text-gray-400">© 2026 BIKEHUB KE • Košice</p>
    </footer>

    <script>
        const DB_URL = "https://kebikes-default-rtdb.europe-west1.firebasedatabase.app/reviews.json";

        async function loadBikes() {
            try {
                const response = await fetch('bikes.json');
                const bikes = await response.json();
                const container = document.getElementById('bike-container');
                container.innerHTML = bikes.map((bike, index) => `
                    <div class="bg-white rounded-[3rem] border border-gray-100 overflow-hidden group hover:shadow-2xl transition-all duration-700 reveal" style="animation-delay: ${index * 0.1}s">
                        <div class="h-80 bg-gray-50 relative overflow-hidden">
                            <img src="${bike.image}" alt="${bike.brand}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000">
                            <span class="absolute top-8 left-8 bg-black/90 backdrop-blur-md text-white text-[9px] font-black px-5 py-2 rounded-full uppercase tracking-widest">${bike.status}</span>
                        </div>
                        <div class="p-10">
                            <div class="flex justify-between items-start mb-6">
                                <div>
                                    <h4 class="text-3xl font-black text-gray-900 uppercase tracking-tighter leading-none">${bike.brand}</h4>
                                    <p class="text-gray-400 text-[10px] font-black uppercase mt-2 tracking-[0.2em]">${bike.model}</p>
                                </div>
                                <div class="text-3xl font-light text-black tracking-tighter italic">${bike.price}€</div>
                            </div>
                            <a href="https://www.bazos.sk" target="_blank" class="block w-full mt-4 text-center text-[9px] font-black uppercase tracking-[0.2em] text-gray-400 hover:text-black transition">Inzerát na Bazoš.sk</a>
                        </div>
                    </div>`).join('');
            } catch (error) { console.error("Chyba načítania bicyklov"); }
        }

        async function sendReview() {
            const name = document.getElementById('rev-name').value;
            const text = document.getElementById('rev-text').value;
            if(!name || !text) return alert("Vyplňte polia!");
            const newReview = { name, text, date: new Date().toLocaleDateString() };
            await fetch(DB_URL, { method: 'POST', body: JSON.stringify(newReview) });
            document.getElementById('rev-name').value = '';
            document.getElementById('rev-text').value = '';
            loadReviews();
        }

        async function loadReviews() {
            const response = await fetch(DB_URL);
            const data = await response.json();
            const container = document.getElementById('reviews-list');
            container.innerHTML = '';
            if (data) {
                Object.values(data).reverse().forEach(rev => {
                    container.innerHTML += `
                        <div class="bg-white p-10 rounded-[2.5rem] border border-gray-100 shadow-sm reveal">
                            <p class="text-gray-600 mb-6 italic leading-relaxed">"${rev.text}"</p>
                            <p class="font-black uppercase text-[10px] tracking-[0.2em] text-black">- ${rev.name}, ${rev.date}</p>
                        </div>`;
                });
            }
        }

        loadBikes();
        loadReviews();
    </script>
</body>
</html>
