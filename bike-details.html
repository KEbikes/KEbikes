<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail bicykla | BIKEHUB KE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #000; }
        .reveal { animation: fadeInUp 0.8s ease-out forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Навигация -->
    <nav class="p-6 border-b border-gray-100 bg-white/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black uppercase tracking-tighter">
                BIKEHUB <span class="text-gray-300 italic">KE</span>
            </a>
            <a href="index.html" class="bg-black text-white px-6 py-2.5 rounded-full font-black uppercase text-[10px] tracking-widest hover:bg-gray-800 transition">
                <i class="fas fa-arrow-left mr-2"></i> Späť
            </a>
        </div>
    </nav>

    <main id="bike-detail-content" class="max-w-6xl mx-auto py-12 md:py-24 px-6">
        <!-- Сюда JS вставит данные -->
        <div class="w-full text-center py-20 text-gray-200 animate-pulse uppercase tracking-widest text-xs font-black">
            Načítavam dáta...
        </div>
    </main>

    <script>
        async function loadBikeDetail() {
            const params = new URLSearchParams(window.location.search);
            const bikeId = params.get('id');

            try {
                const response = await fetch('bikes.json');
                const bikes = await response.json();
                const bike = bikes.find(b => b.id === bikeId);

                if (!bike) {
                    document.getElementById('bike-detail-content').innerHTML = '<h1 class="text-center py-20 font-black text-4xl text-gray-100 uppercase">Nenájdené</h1>';
                    return;
                }

                document.title = `${bike.brand} ${bike.model} | BIKEHUB KE`;

                document.getElementById('bike-detail-content').innerHTML = `
                    <div class="flex flex-col lg:flex-row gap-12 lg:gap-20 reveal">
                        <!-- Секция фото -->
                        <div class="lg:w-3/5">
                            <div class="rounded-[3rem] overflow-hidden bg-gray-50 shadow-sm">
                                <img src="${bike.image}" alt="${bike.brand}" class="w-full h-auto object-cover">
                            </div>
                        </div>

                        <!-- Секция информации -->
                        <div class="lg:w-2/5 flex flex-col justify-center">
                            <div class="mb-8">
                                <span class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-400 mb-4 block underline decoration-gray-200 underline-offset-8">
                                    Status: ${bike.status}
                                </span>
                                <h1 class="text-6xl md:text-8xl font-black uppercase tracking-tighter leading-none mb-2">${bike.brand}</h1>
                                <p class="text-2xl font-light text-gray-400 uppercase tracking-widest italic">${bike.model}</p>
                            </div>

                            <div class="text-5xl font-black text-black mb-12 tracking-tighter">
                                ${bike.price}€
                            </div>

                            <div class="border-t border-gray-100 pt-8 mb-12">
                                <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-300 mb-4">Technický popis</h3>
                                <p class="text-gray-600 leading-relaxed font-medium text-lg">
                                    ${bike.description}
                                </p>
                            </div>

                            <div class="space-y-4">
                                <a href="tel:+421952471384" class="block w-full bg-black text-white text-center py-6 rounded-2xl font-black uppercase text-xs tracking-[0.3em] hover:bg-gray-800 transition-all shadow-xl">
                                    Mám záujem / Zavolať
                                </a>
                                <div class="flex items-center justify-center gap-6 pt-4 text-gray-300">
                                    <span class="text-[9px] font-black uppercase tracking-widest"><i class="fas fa-check mr-2"></i> Servisované</span>
                                    <span class="text-[9px] font-black uppercase tracking-widest"><i class="fas fa-map-marker-alt mr-2"></i> Košice</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error:', error);
            }
        }
        loadBikeDetail();
    </script>
</body>
</html>
