<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail bicykla | BIKEHUB KE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Навигация -->
    <nav class="p-6 border-b border-white/10 bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black uppercase tracking-tighter">
                BIKEHUB <span class="text-yellow-400">KE</span>
            </a>
            <a href="index.html" class="text-gray-400 hover:text-yellow-400 transition uppercase text-xs font-bold tracking-widest">
                <i class="fas fa-arrow-left mr-2"></i> Späť na ponuku
            </a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto py-12 px-4">
        <div id="bike-detail-content" class="flex flex-col lg:flex-row gap-16">
            <!-- Сюда JS вставит данные -->
            <div class="w-full text-center py-20 text-gray-500 animate-pulse uppercase tracking-widest font-black">
                Načítavam detaily stroja...
            </div>
        </div>
    </main>

    <script>
        async function loadBikeDetail() {
            const params = new URLSearchParams(window.location.search);
            const bikeId = params.get('id');

            try {
                const response = await fetch('bikes.json');
                const bikes = await response.json();
                const bike = bikes.find(b => b.id === bikeId);

                if (!bike) {
                    document.getElementById('bike-detail-content').innerHTML = '<h1 class="text-4xl font-black">Bicykel sa nenašiel</h1>';
                    return;
                }

                document.title = `${bike.brand} ${bike.model} | BIKEHUB KE`;

                document.getElementById('bike-detail-content').innerHTML = `
                    <!-- Фото -->
                    <div class="lg:w-2/3">
                        <div class="rounded-[3rem] overflow-hidden border border-white/10 shadow-2xl shadow-yellow-400/5">
                            <img src="${bike.image}" alt="${bike.brand}" class="w-full h-auto object-cover">
                        </div>
                    </div>

                    <!-- Инфо -->
                    <div class="lg:w-1/3 space-y-8">
                        <div>
                            <span class="bg-yellow-400 text-black text-[10px] font-black px-4 py-1 rounded-full uppercase tracking-widest">
                                ${bike.status}
                            </span>
                            <h1 class="text-6xl font-black uppercase tracking-tighter mt-4 leading-none">${bike.brand}</h1>
                            <p class="text-yellow-400 text-xl font-bold uppercase tracking-widest mt-2">${bike.model}</p>
                        </div>

                        <div class="text-5xl font-black tracking-tighter text-white">
                            ${bike.price}€
                        </div>

                        <div class="bg-zinc-900 p-8 rounded-[2.5rem] border border-white/5">
                            <h3 class="text-xs font-black uppercase tracking-widest text-gray-500 mb-4">Popis a stav</h3>
                            <p class="text-gray-300 leading-relaxed font-medium">
                                ${bike.description}
                            </p>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-zinc-900 p-6 rounded-3xl border border-white/5 text-center">
                                <i class="fas fa-check-circle text-yellow-400 mb-2"></i>
                                <p class="text-[10px] uppercase font-black text-gray-500">Servisované</p>
                            </div>
                            <div class="bg-zinc-900 p-6 rounded-3xl border border-white/5 text-center">
                                <i class="fas fa-shuttle-van text-yellow-400 mb-2"></i>
                                <p class="text-[10px] uppercase font-black text-gray-500">Košice odber</p>
                            </div>
                        </div>

                        <a href="tel:+421952471384" class="block w-full bg-yellow-400 text-black text-center py-6 rounded-3xl font-black uppercase text-lg hover:scale-105 transition shadow-xl shadow-yellow-400/20">
                            Mám záujem
                        </a>
                    </div>
                `;
            } catch (error) {
                console.error('Error:', error);
            }
        }
        loadBikeDetail();
    </script>
</body>
</html>
