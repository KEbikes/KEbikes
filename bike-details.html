<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail bicykla | BIKEHUB KE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-white">

    <!-- Навигация -->
    <nav class="p-4 border-b flex justify-between items-center max-w-6xl mx-auto w-full">
        <a href="index.html" class="text-blue-600 font-bold flex items-center">
            <i class="fas fa-arrow-left mr-2"></i> Späť na ponuku
        </a>
        <span class="text-gray-400 text-sm">BIKEHUB KE | Košice</span>
    </nav>

    <main class="max-w-6xl mx-auto py-10 px-4">
        <div id="bike-detail-content" class="flex flex-col lg:flex-row gap-12">
            <!-- Сюда подгрузится контент -->
            <div class="w-full text-center py-20">
                <i class="fas fa-circle-notch fa-spin text-3xl text-blue-600 mb-4"></i>
                <p class="text-gray-500">Načítavam detaily tvojho nového bicykla...</p>
            </div>
        </div>
    </main>

    <script>
        async function loadDetail() {
            const params = new URLSearchParams(window.location.search);
            const bikeId = params.get('id');
            
            try {
                const response = await fetch('bikes.json');
                const bikes = await response.json();
                const bike = bikes.find(b => b.id === bikeId);

                if (!bike) {
                    document.getElementById('bike-detail-content').innerHTML = `
                        <div class="w-full text-center py-20">
                            <h2 class="text-2xl font-bold text-gray-800">Bicykel sa nenašiel 🧐</h2>
                            <p class="text-gray-500 mt-2">Možno bol už predaný. Pozri si našu aktuálnu ponuku.</p>
                            <a href="index.html" class="mt-6 inline-block bg-blue-600 text-white px-6 py-2 rounded-full">Späť</a>
                        </div>
                    `;
                    return;
                }

                document.getElementById('bike-detail-content').innerHTML = `
                    <!-- Сетка изображений (как в Decathlon) -->
                    <div class="lg:w-2/3 space-y-4">
                        <div class="bg-gray-100 rounded-3xl overflow-hidden shadow-inner">
                            <img src="${bike.image}" class="w-full h-auto object-cover hover:scale-105 transition duration-500">
                        </div>
                        <!-- Можно добавить доп. фото в будущем здесь -->
                    </div>

                    <!-- Панель покупки -->
                    <div class="lg:w-1/3">
                        <div class="sticky top-24">
                            <span class="bg-yellow-400 text-black text-[10px] font-black px-2 py-1 uppercase rounded tracking-widest">Najlepšia cena v KE</span>
                            <h1 class="text-5xl font-black mt-4 tracking-tighter uppercase">${bike.brand}</h1>
                            <p class="text-2xl text-gray-400 font-medium mb-6 italic">${bike.model}</p>
                            
                            <div class="flex items-baseline gap-2 mb-8 text-blue-600">
                                <span class="text-5xl font-black">${bike.price}</span>
                                <span class="text-2xl font-bold">€</span>
                            </div>
                            
                            <div class="border-y border-gray-100 py-6 mb-8">
                                <h3 class="font-bold text-gray-900 mb-3 uppercase text-xs tracking-widest">Popis a výbava:</h3>
                                <p class="text-gray-600 leading-relaxed text-sm">${bike.description}</p>
                            </div>

                            <div class="space-y-4">
                                <a href="tel:+421952471384" class="block w-full bg-blue-600 text-white text-center py-5 rounded-2xl font-black text-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200 uppercase tracking-tight">
                                    <i class="fas fa-phone-alt mr-3"></i> Zavolať a kúpiť
                                </a>
                                <div class="flex flex-col items-center gap-2">
                                    <span class="text-xs text-gray-400">perepro1zz@gmail.com</span>
                                    <span class="text-[10px] text-gray-300 uppercase tracking-widest font-bold">ID: ${bike.id}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (e) {
                console.error(e);
            }
        }
        loadDetail();
    </script>
</body>
</html>
