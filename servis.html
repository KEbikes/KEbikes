<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servis | BIKEHUB KE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .hero-gradient { background: linear-gradient(to bottom, #0a0a0a 0%, #1a1a1a 100%); }
    </style>
</head>
<body class="text-gray-900">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-black tracking-tighter uppercase">BIKEHUB <span class="text-gray-300 italic font-bold">KE</span></a>
            <a href="index.html" class="bg-black text-white px-8 py-3 rounded-[1.2rem] font-black uppercase text-[10px] tracking-[0.2em] hover:bg-gray-800 transition shadow-lg">Späť</a>
        </div>
    </header>

    <section class="hero-gradient py-24 px-6 text-white text-center">
        <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tighter mb-6 italic">Profesionálny Servis</h1>
        <p class="text-gray-400 max-w-2xl mx-auto text-lg font-light">Precízna údržba založená na analytickom prístupe.</p>
    </section>

    <main class="max-w-4xl mx-auto py-20 px-6">
        <div class="space-y-12">
            <div class="bg-white p-10 rounded-[3rem] border border-gray-100 shadow-sm">
                <h2 class="text-3xl font-black mb-6 uppercase tracking-tight">Čo ponúkame</h2>
                <ul class="space-y-4 text-gray-600 font-medium">
                    <li class="flex items-center"><i class="fas fa-check text-black mr-4"></i> Kompletná diagnostika a nastavenie radenia</li>
                    <li class="flex items-center"><i class="fas fa-check text-black mr-4"></i> Servis hydraulických bŕzd a odvzdušnenie</li>
                    <li class="flex items-center"><i class="fas fa-check text-black mr-4"></i> Čistenie a premazanie ložísk (stredy, hlavy, náboje)</li>
                    <li class="flex items-center"><i class="fas fa-check text-black mr-4"></i> Centrovacie kolesá a výmena špíc</li>
                </ul>
            </div>
        </div>
    </main>

</body>
</html>
